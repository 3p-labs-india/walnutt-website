<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#57A874" stop-opacity="0.26"/>
      <stop offset="50%" stop-color="#3C6E4E" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#141F18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="up" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3C6E4E"/>
      <stop offset="1" stop-color="#57A874"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#141F18"/>

  <!-- Aurora glow -->
  <ellipse cx="600" cy="265" rx="520" ry="300" fill="url(#glow)"/>

  <!-- Walnutt hexagon logo -->
  <g transform="translate(552, 118) scale(1.1)">
    <path d="M50 4 L81 22 L81 58 L50 76 L19 58 L19 22 Z" stroke="#93C4A4" stroke-width="2.5" fill="none" stroke-linejoin="round" opacity="0.65"/>
    <path d="M44 24 L30 40 L44 56" stroke="#93C4A4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.65"/>
    <path d="M56 24 L70 40 L56 56" stroke="#93C4A4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.65"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="258" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="38" fill="#F3F8F4" text-anchor="middle" letter-spacing="-0.6">Walnutt</text>

  <!-- Headline -->
  <text x="600" y="348" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#F3F8F4" text-anchor="middle" letter-spacing="-1.6">Great companies are built</text>
  <text x="600" y="412" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#93C4A4" text-anchor="middle" letter-spacing="-1.6">on great hires.</text>

  <!-- The K curve, compressed -->
  <g transform="translate(470, 462)">
    <path d="M0 34 L96 34" stroke="rgba(233,240,235,0.28)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M96 34 C150 34, 186 56, 260 84" stroke="#C25E51" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M96 34 C150 34, 186 12, 260 -16" stroke="url(#up)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="96" cy="34" r="4" fill="#93C4A4"/>
    <circle cx="260" cy="-16" r="5.5" fill="#57A874"/>
  </g>

  <!-- Bottom line -->
  <text x="600" y="592" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="rgba(233,240,235,0.32)" text-anchor="middle" letter-spacing="0.4">walnutt.co</text>
</svg>
